name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Fail on committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.env\.example$'; then
            echo '::error::.env files must never be committed'; exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Single source of truth for the Node floor (RN 0.87 requires >= 22.13.0).
          # Bump .nvmrc and the root package.json "engines" together.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tooling/verify-talk-shaders.mjs
      # packages/theme's scheme-scope test renders in headless Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter web --filter @acme/ui --filter @acme/theme test
      # android/ is generated (CNG); build it before checking the XR contract.
      - run: pnpm --filter mobile exec expo prebuild --platform android --no-install
        env:
          # A non-production fixture enables the PICO flavor for manifest
          # checks. No entitlement requests or headset launch occur in CI.
          PICO_APP_ID: "0000000000000000"
      - run: pnpm spatial:verify-android
      - run: pnpm spatial:verify-typegpu
      - run: pnpm verify:routes
      # Committed .riv bytes and manifest against packages/assets/rive/contract.ts; needs no Rive CLI.
      - run: pnpm verify:rive
      - run: pnpm turbo build typecheck lint
