name: Base44 auth integration
on:
  pull_request:
    paths:
      - 'base44/**'
      - 'supabase/**'
      - 'tests/base44-auth*'
      - 'apps/web/scripts/verify-base44-auth.mjs'
      - 'src/lib/auth*'
      - '.github/workflows/base44-auth.yml'
  push:
    branches: [feat/supabase-better-auth-portals]
    paths:
      - 'base44/**'
      - 'supabase/**'
      - 'tests/base44-auth*'
      - 'apps/web/scripts/verify-base44-auth.mjs'
      - 'src/lib/auth*'
      - '.github/workflows/base44-auth.yml'
permissions:
  contents: read
concurrency:
  group: base44-auth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  base44-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pacasa_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pacasa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: HTTP boundary regression tests
        run: node --test tests/base44-auth*.test.mjs
      - name: Real Better Auth and local PostgreSQL integration
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/pacasa_ci
          PACASA_AUTH_INTEGRATION_TEST: '1'
        run: node apps/web/scripts/verify-base44-auth.mjs
      - name: Build actual Base44 Vite surface
        run: pnpm exec vite build
