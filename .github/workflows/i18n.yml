name: PaCasa i18n unit tests
on:
  pull_request:
    paths:
      - 'src/i18n/**'
      - 'src/session/domain.js'
      - 'src/session/voice.js'
      - '.github/workflows/i18n.yml'
  push:
    branches: [main]
    paths:
      - 'src/i18n/**'
      - 'src/session/domain.js'
      - 'src/session/voice.js'
      - '.github/workflows/i18n.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test src/i18n/*.test.mjs
